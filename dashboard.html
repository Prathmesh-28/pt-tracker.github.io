<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fresher Desk · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#F4F3EE; --card:#FBFAF6; --ink:#181A1B; --body:#33373A; --muted:#71767B;
  --line:#DEDCD3; --line-soft:#E9E7DF;
  --accent:#A85D00; --accent-soft:#F0E2CC;
  --open:#126B4F; --open-soft:#D8E9E0;
  --walled:#8B9096; --walled-soft:#E4E3DD;
  --bad:#B42318; --bad-soft:#F6DEDA;
  --series-1:#2a78d6; --series-2:#eb6834;
  --shadow:0 1px 2px rgba(24,26,27,.05); --r:7px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#131517; --card:#1B1E21; --ink:#F1EFE9; --body:#C7C9CB; --muted:#8B9096;
    --line:#2C3034; --line-soft:#242629;
    --accent:#E8A13C; --accent-soft:#3A2C15;
    --open:#4FBE92; --open-soft:#153229;
    --walled:#767B81; --walled-soft:#25282B;
    --bad:#F07A6E; --bad-soft:#3B1D1A;
    --series-1:#3987e5; --series-2:#d95926;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#131517; --card:#1B1E21; --ink:#F1EFE9; --body:#C7C9CB; --muted:#8B9096;
  --line:#2C3034; --line-soft:#242629;
  --accent:#E8A13C; --accent-soft:#3A2C15;
  --open:#4FBE92; --open-soft:#153229;
  --walled:#767B81; --walled-soft:#25282B;
  --bad:#F07A6E; --bad-soft:#3B1D1A;
  --series-1:#3987e5; --series-2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font:450 14.5px/1.55 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 72px}
a{color:inherit}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;color:var(--ink);margin:0;text-wrap:balance}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:22px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand a{font-size:13px;color:var(--muted)}
.runbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-block:10px;margin-bottom:22px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs a{padding:7px 12px;border-radius:var(--r);text-decoration:none;font-weight:500;font-size:14px;color:var(--muted);white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--line-soft)}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
nav.tabs .n{font-size:11.5px;margin-left:5px;color:var(--muted)}

/* ---------- building blocks ---------- */
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:99px;background:var(--line-soft);color:var(--body);white-space:nowrap}
.pill.ok{background:var(--open-soft);color:var(--open)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.run{background:var(--accent-soft);color:var(--accent)}
.pill.run::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.pill.run::before{animation:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 16px}
.card > h2,.card > h3{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.section{margin-bottom:26px}
.section-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.lede{margin:4px 0 0;color:var(--muted);max-width:74ch}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.tile{background:var(--card);padding:14px 16px 13px;display:flex;flex-direction:column;gap:3px;text-decoration:none}
a.tile:hover{background:var(--accent-soft)}
.tile .v{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:700;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .k{font-size:12.5px;font-weight:600;color:var(--body)}
.tile .h{font-size:11.5px;color:var(--muted);line-height:1.4}

dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:13.5px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:12px;letter-spacing:.02em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--line-soft)}
td .sub{display:block;color:var(--muted);font-size:12.5px}
.empty{padding:28px;text-align:center;color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--body)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=url],select,textarea{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:7px 10px;font-size:14px;min-width:0;max-width:100%}
input[type=search]{flex:1 1 220px}
textarea{width:100%;min-height:110px;resize:vertical}
select.status{padding:4px 8px;font-size:13px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.field > *{font-weight:450;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:12px}

/* ---------- pipeline bars ---------- */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(110px,150px) 1fr 42px;gap:10px;align-items:center;font-size:13px;text-decoration:none}
.bar .track{height:12px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:0}
.bar.end .fill{background:var(--walled)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
a.bar:hover .track{outline:1px solid var(--line)}

/* ---------- flow ---------- */
ol.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;counter-reset:step}
ol.flow li{counter-increment:step;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;position:relative}
ol.flow li::before{content:counter(step);position:absolute;top:10px;right:12px;font:600 12px "IBM Plex Mono",monospace;color:var(--muted)}
ol.flow b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:3px;padding-right:18px}
ol.flow p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
ol.flow code{font-size:11.5px;color:var(--body);overflow-wrap:anywhere}
ol.flow li.done{border-color:color-mix(in srgb,var(--open) 45%,var(--line))}
ol.flow li.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* ---------- chart ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line-soft)}
.chart .axis text{fill:var(--muted);font:11px "IBM Plex Mono",monospace}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--body);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.12);padding:8px 10px;font-size:12.5px;line-height:1.5;min-width:150px}
.tip b{display:block;margin-bottom:2px}
.tip .row{display:flex;justify-content:space-between;gap:14px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

pre.log{margin:0;max-height:460px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;font:12px/1.55 "IBM Plex Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- drawer ---------- */
dialog.drawer{border:0;padding:0;margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(560px,100vw);max-width:100vw;background:var(--paper);color:var(--body);box-shadow:-8px 0 30px rgba(0,0,0,.18)}
dialog.drawer::backdrop{background:rgba(10,12,14,.35)}
.drawer .inner{padding:20px 20px 40px;display:flex;flex-direction:column;gap:16px}
.drawer header{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.drawer h2{font-size:20px}
.timeline{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:6px}
.timeline li{display:flex;gap:10px}
.timeline .mono{color:var(--muted);font-size:12px;white-space:nowrap}
.files{display:flex;flex-wrap:wrap;gap:6px}
.notice{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--card);border-radius:var(--r);padding:10px 12px;font-size:13.5px}
.notice.bad{border-left-color:var(--bad)}
.notice.ok{border-left-color:var(--open)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:var(--r);font-size:13.5px;z-index:40;max-width:calc(100vw - 32px)}
.vis-public{background:var(--line-soft);color:var(--body)}
.vis-local{background:var(--accent-soft);color:var(--accent)}
.vis-private{background:var(--open-soft);color:var(--open)}
@media (max-width:640px){
  .bar{grid-template-columns:100px 1fr 34px}
  dl.facts{grid-template-columns:1fr}
  dl.facts dt{margin-top:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>Fresher <em>Desk</em></h1>
      <a href="./index.html">Roles page ↗</a>
    </div>
    <div class="runbox">
      <span id="runpill" class="pill">…</span>
      <button class="btn primary" id="refresh">Refresh everything</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Dashboard sections">
    <a href="#overview">Overview</a>
    <a href="#applications">Applications<span class="n" id="n-apps"></span></a>
    <a href="#workflows">Workflows</a>
    <a href="#sources">Sources</a>
    <a href="#history">History</a>
    <a href="#data">Data</a>
    <a href="#settings">Settings</a>
  </nav>
  <main id="view" aria-live="polite"></main>
</div>

<div id="tip" class="tip" hidden></div>

<dialog class="drawer" id="drawer" aria-labelledby="d-title">
  <div class="inner" id="drawer-body"></div>
</dialog>

<script>
"use strict";
/* ============================================================
   Plumbing
   ============================================================ */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const fmtNum = n => (n ?? 0).toLocaleString("en-IN");
const SITE = {linkedin:"LinkedIn", indeed:"Indeed", naukri:"Naukri", glassdoor:"Glassdoor", google:"Google Jobs",
              greenhouse:"Greenhouse", lever:"Lever", ashby:"Ashby", manual:"Added by hand"};

async function api(path, body){
  const opts = body === undefined ? {cache:"no-store"}
    : {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)};
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) { const e = new Error((data && data.error) || `${res.status} ${res.statusText}`); e.status = res.status; e.data = data; throw e; }
  return data;
}

function when(iso, withDate = true){
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  const today = new Date(); const same = d.toDateString() === today.toDateString();
  const t = d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  if (same) return `today ${t}`;
  const y = new Date(today); y.setDate(today.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `yesterday ${t}`;
  return withDate ? d.toLocaleDateString([], {day:"numeric", month:"short"}) + " " + t : t;
}
const day = iso => iso ? new Date(iso + (iso.length === 10 ? "T00:00" : "")).toLocaleDateString([], {day:"numeric", month:"short", year:"numeric"}) : "—";
const dur = s => s == null ? "—" : s < 60 ? `${s}s` : `${Math.floor(s/60)}m ${String(s%60).padStart(2,"0")}s`;

let toastTimer;
function toast(msg){
  let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200);
}

function nextRun(hhmm){
  if (!hhmm) return null;
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d <= new Date()) d.setDate(d.getDate() + 1);
  return d;
}

const tip = $("#tip");
function showTip(evt, html){
  tip.innerHTML = html; tip.hidden = false;
  const pad = 14, r = tip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tip.hidden = true;

/* ============================================================
   Run status in the top bar (polls while a run is going)
   ============================================================ */
let runState = {running:false};
let pollTimer = null;
async function pollStatus(){
  try { runState = await api("/api/status"); }
  catch { $("#runpill").className = "pill bad"; $("#runpill").textContent = "Server unreachable"; return; }
  const pill = $("#runpill"), btn = $("#refresh");
  if (runState.running){
    const step = (runState.log || []).filter(l => l.startsWith("== ")).slice(-1)[0];
    pill.className = "pill run"; pill.textContent = step ? `Refreshing · ${step.slice(3)}` : "Refreshing…";
    btn.disabled = true;
    clearTimeout(pollTimer); pollTimer = setTimeout(async () => {
      await pollStatus();
      if (!runState.running){ toast("Refresh finished"); render(); }
    }, 2500);
  } else {
    const fin = (runState.log || []).find(l => l.startsWith("finished"));
    const ok = !fin || /exit 0$/.test(fin);
    pill.className = "pill " + (ok ? "ok" : "bad");
    pill.textContent = fin ? (ok ? "Idle · last run OK" : "Last run failed") : "Idle";
    btn.disabled = false;
  }
}
$("#refresh").addEventListener("click", async () => {
  $("#refresh").disabled = true;
  try { await api("/api/refresh", {}); toast(runState.search_allowed_now ? "Refresh started, including LinkedIn and Indeed" : "Refresh started; LinkedIn and Indeed reuse their last results (cooldown)"); }
  catch (e){ if (e.status !== 409) toast(`Could not start: ${e.message}`); }
  setTimeout(pollStatus, 800);
});

/* ============================================================
   Router
   ============================================================ */
const VIEWS = {overview: vOverview, applications: vApplications, workflows: vWorkflows, sources: vSources,
               history: vHistory, data: vData, settings: vSettings};
async function render(){
  const name = (location.hash.slice(1).split("?")[0]) || "overview";
  const view = VIEWS[name] ? name : "overview";
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + view ? "page" : "false"));
  const main = $("#view");
  if (!main.dataset.view || main.dataset.view !== view) main.innerHTML = `<p class="muted">Loading…</p>`;
  main.dataset.view = view;
  try { await VIEWS[view](main, new URLSearchParams(location.hash.split("?")[1] || "")); }
  catch (e){
    main.innerHTML = e.status === 404 || e instanceof TypeError
      ? `<div class="notice bad"><b>This dashboard needs the tracker's local server.</b><br>
         Open <a href="http://127.0.0.1:8765/dashboard.html">http://127.0.0.1:8765/dashboard.html</a> on the Mac that runs it.
         If that does not load, run <code>./scripts/schedule_mac.sh install</code> in the project folder.</div>`
      : `<div class="notice bad">Something went wrong loading this page: ${esc(e.message)}</div>`;
  }
}
addEventListener("hashchange", render);

/* ============================================================
   Overview
   ============================================================ */
const PIPE = ["saved","tailored","applied","interview","offer"];
const ENDS = ["rejected","withdrawn","skipped"];

async function vOverview(main){
  const o = await api("/api/overview");
  const a = o.applications, L = o.labels;
  const active = PIPE.reduce((s, k) => s + a[k], 0);
  const max = Math.max(1, ...Object.values(a));
  const s = o.search, lr = o.last_run, nxt = nextRun(o.schedule.time);
  $("#n-apps").textContent = active ? active : "";
  const bar = (k, end) => `<a class="bar ${end ? "end" : ""}" href="#applications?status=${k}">
      <span>${esc(L[k])}</span><span class="track"><span class="fill" style="width:${(a[k] / max * 100).toFixed(1)}%"></span></span>
      <span class="n">${a[k]}</span></a>`;
  const searchCounts = Object.entries(s.counts || {}).map(([k, n]) => `${SITE[k] || k} ${fmtNum(n)}`).join(" · ");

  main.innerHTML = `
  <div class="tiles">
    <a class="tile" href="./index.html"><span class="v">${fmtNum(o.roles)}</span><span class="k">Roles tracked</span><span class="h">Business-track, India · built ${esc(day(o.generated))}</span></a>
    <a class="tile" href="./index.html"><span class="v">${fmtNum(o.open_to_grad)}</span><span class="k">Open to ${o.grad_year} grads</span><span class="h">Internships, roles naming ${o.grad_year}, and fresher roles naming no batch</span></a>
    <div class="tile"><span class="v">${fmtNum(o.new_today)}</span><span class="k">New today</span><span class="h">First seen in today's pulls</span></div>
    <div class="tile"><span class="v">${fmtNum(o.internships)}</span><span class="k">Internships</span><span class="h">By title or listing type</span></div>
    <div class="tile"><span class="v">${fmtNum(o.tier1)}</span><span class="k">In Tier 1 cities</span><span class="h">Metros plus NCR and Mumbai satellites</span></div>
    <a class="tile" href="#applications"><span class="v">${fmtNum(active)}</span><span class="k">Applications in progress</span><span class="h">Saved through offer</span></a>
  </div>

  <div class="grid g2 section">
    <div class="card">
      <div class="section-head"><h2>Your applications</h2><a class="small" href="#applications">Open tracker →</a></div>

    </div>

    <div class="card">
      <div class="section-head"><h2>Workflow</h2><a class="small" href="#workflows">All runs →</a></div>
      <dl class="facts">
        <dt>Last run</dt><dd>${lr ? `${runPill(lr.state)} ${when(lr.started)} · ${dur(lr.seconds)} · ${esc({schedule:"daily schedule", dashboard:"from the dashboard", page:"from the roles page", manual:"from the terminal", unrecorded:"trigger not recorded"}[lr.trigger] || lr.trigger)}` : "No runs logged yet"}</dd>
        <dt>Next scheduled</dt><dd>${o.schedule.installed ? `${nxt ? when(nxt.toISOString()) : "—"} <span class="muted">(daily at ${esc(o.schedule.time)})</span>` : `<span class="pill bad">Not scheduled</span> run <code>./scripts/schedule_mac.sh install</code>`}</dd>
        <dt>LinkedIn &amp; Indeed</dt><dd>searched ${when(s.searched_at)}${searchCounts ? ` <span class="muted">(${esc(searchCounts)})</span>` : ""}
          ${(s.blocked || []).length ? `<br><span class="pill bad">Blocked: ${esc(s.blocked.map(k => SITE[k] || k).join(", "))}</span> earlier results kept` : ""}</dd>
        <dt>Next search</dt><dd>${s.search_allowed_now ? `<span class="pill ok">Allowed now</span> the next refresh searches them` : `after ${when(s.next_search_after)} <span class="muted">(4-hour cooldown keeps LinkedIn from blocking you)</span>`}</dd>
        <dt>Company boards</dt><dd>${o.boards} Greenhouse, Lever and Ashby boards, every run</dd>
        <dt>This week</dt><dd>${o.runs_7d} runs${o.failed_7d ? `, <span class="pill bad">${o.failed_7d} failed</span>` : ", none failed"}</dd>
      </dl>
    </div>
  </div>

  <div class="section">
    <div class="section-head"><div><h2>How it works</h2>
      <p class="lede">Every morning at ${esc(o.schedule.time)}, and whenever you press Refresh, these steps run in order on this Mac. Each one reads what the step before it wrote.</p></div></div>
    ${flowSteps(lr)}
  </div>`;
}

function runPill(state){
  return {ok:`<span class="pill ok">OK</span>`, failed:`<span class="pill bad">Failed</span>`,
          running:`<span class="pill run">Running</span>`, interrupted:`<span class="pill warn">Interrupted</span>`}[state] || "";
}

const FLOW = [
  ["Company boards", "Company boards", "Reads every posting from 15 employers' Greenhouse, Lever and Ashby boards.", "data/raw/all_postings.json"],
  ["LinkedIn and Indeed", "LinkedIn and Indeed", "Searches 15 queries with JobSpy, at most once every 4 hours, and merges them in. Every search is archived.", "data/archive/"],
  ["Reading descriptions", "Read descriptions", "Pulls the years of experience, batch years and internship-or-not out of each posting's own text.", "all_postings.json"],
  ["Funding news", "Funding news", "Reads Entrackr, Inc42 and YourStory for recent rounds.", "data/raw/rounds.json"],
  ["History", "History", "Marks first seen, last seen and closed for every role, and snapshots the day.", "data/seen.json, data/history/"],
  ["Building the page", "Build the pages", "Filters to India business-track roles, tiers cities, flags funded employers, writes the roles page and bundle.", "data/latest.json, index.html"],
];
function flowSteps(run){
  const steps = run ? run.steps : [];
  const live = run && run.state === "running";
  return `<ol class="flow">${FLOW.map(([log, name, what, out]) => {
    const i = steps.indexOf(log);
    const cls = i === -1 ? "" : (live && i === steps.length - 1 ? "now" : "done");
    return `<li class="${cls}"><b>${esc(name)}</b><p>${esc(what)}</p><p style="margin-top:6px"><code>${esc(out)}</code></p></li>`;
  }).join("")}
  <li><b>You</b><p>Shortlist roles on the roles page, tailor a resume from the Applications tab, and move each one along as you hear back.</p><p style="margin-top:6px"><code>private/tracker.db</code></p></li></ol>`;
}

        : `<p class="small muted" style="margin:0 0 8px">No tailored resume yet. Gemini checks the fit first, then rewrites your master resume for this posting using only what is already in it.</p>`}
      ${r.tier ? `<div style="margin-top:10px"><button class="btn" id="e-tailor">${a.files.length ? "Tailor again" : "Tailor my resume"}</button></div><div id="e-task" class="small" style="margin-top:8px"></div>`

  };

  if (running) watchTask(key);
}

async function refreshApps(key){
  appsCache = await api("/api/applications");
  if (location.hash.startsWith("#applications")){ await vApplications($("#view"), new URLSearchParams()); }
  if (key && drawer.open) openApp(key);
}

function watchTask(key){
  clearTimeout(taskTimer);
  const tick = async () => {
    const task = (await api("/api/tasks")).find(t => t.key === key);
    const box = $("#e-task"); if (!box || !task) return;
    const out = (task.output || []).slice(-4).map(esc).join("<br>");
    if (task.running){
      box.innerHTML = `<span class="pill run">Tailoring</span><div class="mono" style="margin-top:6px">${out}</div>`;
      $("#e-tailor") && ($("#e-tailor").disabled = true);
      taskTimer = setTimeout(tick, 2500);
    } else {
      box.innerHTML = task.exit_code === 0 ? `<span class="pill ok">Done</span>` : `<span class="pill bad">Failed</span><div class="mono" style="margin-top:6px">${out}</div>`;
      if (task.exit_code === 0){ toast("Resume tailored"); refreshApps(key); }
      else $("#e-tailor") && ($("#e-tailor").disabled = false);
    }
  };
  tick();
}

    $("#closelog").onclick = () => $("#logview").innerHTML = "";
    $("#logview").scrollIntoView({behavior:"smooth", block:"start"});
  });
}
function flowMini(run){
  return `<ul class="timeline">${FLOW.map(([log, name]) => {
    const i = run ? run.steps.indexOf(log) : -1;
    const now = run && i === run.steps.length - 1;
    return `<li><span class="mono">${i === -1 ? "·" : now ? "…" : "✓"}</span><span class="${i === -1 ? "muted" : ""}">${esc(name)}</span></li>`;
  }).join("")}</ul>`;
}

  </div>`;
  const box = $("#chartbox");
  const table = () => `<div class="tablewrap"><table><thead><tr><th>Day</th><th class="num">New from boards</th><th class="num">New from LinkedIn &amp; Indeed</th><th class="num">Closed</th><th class="num">Live that day</th></tr></thead>
    <tbody>${days.slice().reverse().map(d => `<tr><td class="mono small">${esc(d.day)}</td><td class="num mono">${fmtNum(d.new_board)}</td><td class="num mono">${fmtNum(d.new_search)}</td><td class="num mono">${fmtNum(d.closed)}</td><td class="num mono">${d.tracked == null ? "—" : fmtNum(d.tracked)}</td></tr>`).join("")}</tbody></table></div>`;

/* Stacked bars, one per day: boards at the base, search on top. Thin marks,
   rounded data ends, a 2px surface gap between the two segments. */
function stackedBars(days){
  if (!days.length) return `<div class="empty">No history yet.</div>`;
  const W = Math.max(320, $("#chartbox").clientWidth || 800), H = 240;
  const m = {t: 12, r: 8, b: 26, l: 44};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const totals = days.map(d => d.new_board + d.new_search);
  const max = Math.max(1, ...totals);
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const y = v => m.t + ih - v / top * ih;
  const band = iw / days.length, bw = Math.max(3, Math.min(34, band * .62));
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  const every = Math.ceil(days.length / Math.max(1, Math.floor(iw / 70)));
  const seg = (x, y0, y1, roundTop) => {
    const h = Math.max(0, y0 - y1); if (h <= 0) return "";
    const r = Math.min(4, h, bw / 2);
    return roundTop
      ? `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 + r}V${y0}Z`
      : `M${x},${y0}V${y1}H${x + bw}V${y0}Z`;
  };
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="New roles per day, stacked by source">
    <g class="grid">${ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>
    <g class="axis">${ticks.map(v => `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`).join("")}
      ${days.map((d, i) => i % every === 0 ? `<text x="${m.l + band * i + band / 2}" y="${H - 8}" text-anchor="middle">${esc(d.day.slice(5))}</text>` : "").join("")}</g>
    <g>${days.map((d, i) => {
      const x = m.l + band * i + (band - bw) / 2;
      const b0 = y(0), b1 = y(d.new_board), s1 = y(d.new_board + d.new_search);
      const gap = d.new_board && d.new_search ? 2 : 0;
      return `<path d="${seg(x, b0, b1, !d.new_search)}" fill="var(--series-1)"/>
        <path d="${seg(x, b1 - gap, Math.min(s1, b1 - gap), true)}" fill="var(--series-2)"/>
        <rect class="hit" data-i="${i}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"/>`;
    }).join("")}</g>
  </svg></div>`;
}
function niceStep(max){
  const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
function wireBars(box, days){
  box.querySelectorAll("rect.hit").forEach(r => {
    const d = days[+r.dataset.i];
    r.addEventListener("mousemove", e => showTip(e, `<b>${esc(day(d.day))}</b>
      <div class="row"><span><i style="background:var(--series-1)"></i>Company boards</span><span class="mono">${fmtNum(d.new_board)}</span></div>
      <div class="row"><span><i style="background:var(--series-2)"></i>LinkedIn &amp; Indeed</span><span class="mono">${fmtNum(d.new_search)}</span></div>
      <div class="row muted"><span>Closed</span><span class="mono">${fmtNum(d.closed)}</span></div>`));
    r.addEventListener("mouseleave", hideTip);
  });
}
