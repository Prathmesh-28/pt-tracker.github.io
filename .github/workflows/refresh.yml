name: Refresh job data

on:
  schedule:
    # Four times a day. Board feeds do not change faster than this.
    # The first (06:47 IST) is the only one that searches LinkedIn and Indeed.
    - cron: "17 1 * * *"
    - cron: "17 7,13,19 * * *"
  workflow_dispatch:
    inputs:
      rediscover:
        description: "Re-probe every candidate slug (slow, ~2200 requests)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Re-discover boards
        if: ${{ inputs.rediscover }}
        run: python scripts/probe_boards.py

      - name: Pull postings
        run: python scripts/fetch_jobs.py

      # Once a day is plenty and keeps LinkedIn from throttling the runner.
      # A blocked site keeps its last good results; set JOBSPY_PROXIES as a
      # repo secret if the morning run is blocked every day.
      - name: Pull LinkedIn and Indeed via JobSpy
        if: ${{ github.event.schedule == '17 1 * * *' || github.event_name == 'workflow_dispatch' }}
        run: python scripts/fetch_search.py
        continue-on-error: true
        env:
          JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}

      - name: Merge the morning's LinkedIn and Indeed results
        if: ${{ github.event.schedule != '17 1 * * *' && github.event_name != 'workflow_dispatch' }}
        run: python scripts/fetch_search.py --cached

      - name: Read descriptions and parse experience
        run: python scripts/enrich.py

      - name: Pull funding feeds
        run: python scripts/funding.py 60
        continue-on-error: true

      - name: Update recruitment history
        run: python scripts/track_history.py

      - name: Build page data
        run: python scripts/build_data.py

      - name: Render page
        run: python scripts/render.py

      - name: Compile the single-file bundle
        run: python scripts/compile_all.py

      - name: Commit if anything changed
        run: |
          git config user.name  "pt-tracker bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html pt-tracker-all.json pt-tracker-all.csv
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
